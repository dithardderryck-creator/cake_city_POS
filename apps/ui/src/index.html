<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cake POS · Sign in</title>
<link rel="stylesheet" href="/fonts.css">
<style>
:root{--bg:#15110c;--paper:#1c1711;--surf:#211b14;--line:#3a3025;--ink:#f3ebdd;--mute:#b3a592;--cop:#d9943e;--cop-s:#d9943e24;--risk:#e1735c;--risk-s:#e1735c22;--on:#1a1208}
:root[data-theme="light"]{--bg:#FDFBF7;--paper:#F5F1E8;--surf:#fff;--line:#E6DECD;--ink:#1F1A13;--mute:#6B5E4F;--cop:#C47F3D;--cop-s:#C47F3D1f;--risk:#B4452F;--risk-s:#B4452F18;--on:#fff}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#FDFBF7;--paper:#F5F1E8;--surf:#fff;--line:#E6DECD;--ink:#1F1A13;--mute:#6B5E4F;--cop:#C47F3D;--cop-s:#C47F3D1f;--risk:#B4452F;--risk-s:#B4452F18;--on:#fff}}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:400 15px/1.45 "Plus Jakarta Sans Variable","Plus Jakarta Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding:16px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--cop);outline-offset:2px}
.card{width:100%;max-width:380px;text-align:center}
.brand{font:600 28px "Fraunces Variable",Fraunces,Georgia,serif;margin:0 0 4px}.brand i{font-style:normal;color:var(--cop)}
.mute{color:var(--mute)}.msg{min-height:22px;margin:10px 0 0;font-size:14px}.msg.err{color:var(--risk)}
.who{display:grid;gap:8px;margin:20px 0 0}
.who button{display:flex;justify-content:space-between;align-items:center;min-height:52px;padding:0 16px;border-radius:14px;background:var(--paper);border:1px solid var(--line);text-align:left}
.who button b{font-weight:600}.who button span{color:var(--mute);font-size:13px;text-transform:capitalize}
.who button:hover{border-color:var(--cop)}
.dots{display:flex;gap:12px;justify-content:center;margin:18px 0;min-height:16px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--cop)}.dots i.on{background:var(--cop)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center}
.pad button{height:60px;border-radius:14px;background:var(--paper);border:1px solid var(--line);font:600 22px "Fraunces Variable",Fraunces,serif}
.pad button.ok{background:var(--cop);color:var(--on);border-color:var(--cop);font:600 16px "Plus Jakarta Sans Variable",system-ui,sans-serif}
.pad button:disabled{opacity:.45;cursor:default}
.link{margin-top:16px;color:var(--mute);text-decoration:underline;min-height:44px}
[hidden]{display:none!important}
@media(prefers-reduced-motion:no-preference){.dots.bad{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}}
</style>
</head>
<body>
<main class="card">
  <h1 class="brand">Cake <i>POS</i></h1>
  <p class="mute" id="sub">Who is signing in?</p>
  <div id="pick" class="who" aria-label="Staff"></div>
  <section id="pin" hidden>
    <h2 id="name" style="margin:0;font:600 20px 'Fraunces Variable',Fraunces,serif"></h2>
    <div class="dots" id="dots" aria-live="polite"></div>
    <div class="pad" id="pad"></div>
    <button class="link" id="back">Not you? Choose someone else</button>
  </section>
  <p class="msg" id="msg" role="status"></p>
</main>
<script src="/cake.js"></script>
<script>
(async()=>{
const $=s=>document.querySelector(s),MIN=4,MAX=6;
let who=null,pin="",busy=false;
const msg=(t,err)=>{$("#msg").textContent=t||"";$("#msg").className="msg"+(err?" err":"")};
try{const t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
// Already signed in on this device? Go straight to the right page.
const s=await Cake.client.restore();
if(s){location.replace(Cake.HOME[s.role]);return}
async function list(){
  msg("");const rows=await Cake.staff();
  $("#pick").innerHTML=rows.length?rows.map(r=>`<button data-id="${Cake.esc(r.id)}" data-n="${Cake.esc(r.name)}"><b>${Cake.esc(r.name)}</b><span>${Cake.esc(r.role)}</span></button>`).join(""):"";
  if(!rows.length)msg("Cannot reach the shop server. Check the wifi, then reload.",true);
}
function dots(){$("#dots").innerHTML=Array.from({length:Math.max(MIN,pin.length)},(_,i)=>`<i class="${i<pin.length?"on":""}"></i>`).join("");$("#ok").disabled=pin.length<MIN||busy}
$("#pad").innerHTML=[1,2,3,4,5,6,7,8,9].map(k=>`<button data-k="${k}">${k}</button>`).join("")+`<button data-k="back" aria-label="Delete">⌫</button><button data-k="0">0</button><button class="ok" id="ok" data-k="ok" disabled>OK</button>`;
async function submit(){
  if(pin.length<MIN||busy)return;busy=true;dots();msg("Checking…");
  const err=await Cake.signIn(who.id,pin);
  busy=false;
  if(err){pin="";dots();msg(err,true);$("#dots").classList.add("bad");setTimeout(()=>$("#dots").classList.remove("bad"),400)}
}
$("#pad").onclick=e=>{const b=e.target.closest("button");if(!b||busy)return;const k=b.dataset.k;
  if(k==="back")pin=pin.slice(0,-1);else if(k==="ok")return submit();else if(pin.length<MAX)pin+=k;
  msg("");dots()};
addEventListener("keydown",e=>{if($("#pin").hidden)return;if(/^\d$/.test(e.key)&&pin.length<MAX){pin+=e.key;msg("");dots()}else if(e.key==="Backspace"){pin=pin.slice(0,-1);dots()}else if(e.key==="Enter")submit()});
$("#pick").onclick=e=>{const b=e.target.closest("button");if(!b)return;who={id:b.dataset.id,n:b.dataset.n};pin="";$("#name").textContent=who.n;$("#sub").textContent="Enter your PIN";$("#pick").hidden=true;$("#pin").hidden=false;msg("");dots()};
$("#back").onclick=()=>{who=null;pin="";$("#pin").hidden=true;$("#pick").hidden=false;$("#sub").textContent="Who is signing in?";msg("");list()};
list();
})();
</script>
</body>
</html>
