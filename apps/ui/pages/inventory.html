<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Cake POS · Inventory</title>
<link rel="stylesheet" href="/fonts.css">
<style>
:root{--bg:#FDFBF7;--paper:#F5F1E8;--surf:#fff;--line:#E6DECD;--ink:#1F1A13;--mute:#6B5E4F;--cop:#C47F3D;--cop-d:#9A5F2A;--cop-s:#C47F3D1f;--sage:#5E7247;--sage-s:#5E72471c;--risk:#B4452F;--risk-s:#B4452F18;--sh:0 1px 2px #1f1a1308,0 10px 28px -14px #1f1a1322;--ease:cubic-bezier(.32,.72,0,1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#15110c;--paper:#1c1711;--surf:#211b14;--line:#3a3025;--ink:#f3ebdd;--mute:#b3a592;--cop:#d9943e;--cop-d:#e3a458;--cop-s:#d9943e24;--sage:#9ab383;--sage-s:#9ab38326;--risk:#e1735c;--risk-s:#e1735c22;--sh:0 10px 28px -14px #000a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#15110c;--paper:#1c1711;--surf:#211b14;--line:#3a3025;--ink:#f3ebdd;--mute:#b3a592;--cop:#d9943e;--cop-d:#e3a458;--cop-s:#d9943e24;--sage:#9ab383;--sage-s:#9ab38326;--risk:#e1735c;--risk-s:#e1735c22;--sh:0 10px 28px -14px #000a}
html{scroll-padding-top:calc(var(--hh,120px) + 8px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cop);outline-offset:2px}
.serif,h1,h2,.num{font-family:Fraunces,Georgia,serif;font-variant-numeric:tabular-nums}
.app{min-height:100dvh}
main{padding:24px clamp(16px,3vw,40px) 48px;max-width:1260px;width:100%;margin:0 auto}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
h1{font-size:clamp(26px,3.4vw,36px);font-weight:600;margin:0;letter-spacing:-.01em}
.sub{color:var(--mute);margin:2px 0 0}
.find{display:flex;align-items:center;gap:10px;min-width:230px;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surf);color:var(--mute);transition:border-color .3s}
.find:hover{border-color:var(--cop)}
.find kbd{margin-left:auto;font:500 11px inherit;border:1px solid var(--line);border-radius:6px;padding:1px 6px}@media(hover:none),(max-width:700px){.find kbd{display:none}}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:20px}
.rev{grid-column:span 8}
.due{grid-column:span 4}
.stock{grid-column:span 5}
.act{grid-column:span 12}
h2{font-size:17px;font-weight:600;margin:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}

.seg button{white-space:nowrap;border:0;background:none;padding:5px 14px;border-radius:999px;color:var(--mute);transition:all .35s var(--ease)}
.seg button[aria-pressed="true"]{background:var(--surf);color:var(--ink);box-shadow:var(--sh)}
svg{display:block;width:100%;height:auto;overflow:visible}
.item{display:grid;gap:2px;padding:12px 14px;border-radius:12px;background:var(--paper);border-left:3px solid var(--sage)}
.item.risk{border-left-color:var(--risk);background:var(--risk-s)}
.item b{font-weight:600}
.item small,.mute{color:var(--mute)}
.tag{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--sage-s);color:var(--sage)}

.bar{height:8px;border-radius:8px;background:var(--paper);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:8px;background:var(--sage);width:0;transition:width 1s var(--ease)}
.bar i.low{background:var(--risk)}

.s{margin-top:14px}
.confirm{margin-top:16px;padding:12px 14px;border-radius:12px;border:1px dashed var(--cop);display:flex;justify-content:space-between;align-items:center;gap:10px}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

.b:active{transform:scale(.96)}

.b.p:hover{background:var(--cop-d)}
.empty{color:var(--mute);padding:18px 0 4px}
details summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between}

.pal{position:fixed;inset:0;background:#1f1a1366;display:none;align-items:flex-start;justify-content:center;padding-top:14vh;z-index:20}
.pal.on{display:flex}
.pal>div{width:min(560px,92vw);background:var(--surf);border-radius:18px;border:1px solid var(--line);box-shadow:0 30px 70px -20px #0008;overflow:hidden;animation:pop .35s var(--ease)}

.pal li button:hover,.pal li button:focus-visible{background:var(--cop-s)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;opacity:0;transition:all .4s var(--ease);z-index:30;pointer-events:none}

.split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px;margin-top:16px;align-items:start}
.rl{display:grid;gap:10px}

.rc:hover,.rc[aria-selected="true"]{border-color:var(--cop)}
.rc[aria-selected="true"]{box-shadow:var(--sh)}
.dots{display:flex;gap:4px}
.dots i{height:4px;flex:1;border-radius:4px;background:var(--line);transition:background .4s}
.dots i.on{background:var(--cop)}
.steps{display:grid;grid-template-columns:repeat(var(--n),1fr);margin:20px 0 16px}
.st{text-align:center;position:relative;font-size:12px;color:var(--mute)}
.st::before{content:"";display:block;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);margin:0 auto 6px;background:var(--surf);position:relative;z-index:1;transition:all .4s var(--ease)}
.st::after{content:"";position:absolute;top:8px;left:calc(-50% + 9px);right:calc(50% + 9px);height:2px;background:var(--line);transition:background .4s}
.st:first-child::after{display:none}
.st.on{color:var(--ink);font-weight:600}
.st.on::before{background:var(--cop);border-color:var(--cop)}
.st.on::after{background:var(--cop)}
.st.cur::before{box-shadow:0 0 0 5px var(--cop-s)}
.chip{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;background:var(--paper);font-size:12px;margin:0 6px 6px 0}
.chip.ok{background:var(--sage-s);color:var(--sage)}
.tl{list-style:none;padding:0;margin:8px 0 0}

@media(max-width:900px){.split{grid-template-columns:1fr}.rev,.due,.stock,.req,.act{grid-column:span 12}.find{width:100%}}
.bulk .b{background:transparent;color:var(--bg);border-color:#ffffff40}

.sw{width:42px;height:24px;border-radius:999px;border:0;background:var(--line);position:relative;transition:background .3s}

.sw[aria-checked="true"] i{transform:translateX(18px)}
.dr{position:fixed;inset:0;background:#1f1a1366;z-index:25;display:flex;justify-content:flex-end}

.oc.risk{border-left:3px solid var(--risk)}

.hb .bar{margin:0}

.nov[hidden]{display:none}
.ndl{background:var(--surf);border-radius:20px;padding:20px;width:min(460px,100%);max-height:90vh;overflow:auto;box-shadow:var(--sh)}
.nlab{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}

.gl{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:16px 0 8px}.gl.hot{color:var(--risk)}.gl:first-child{margin-top:0}

.rgl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}.rgi{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;margin-top:8px}.dash{color:var(--mute)}
.derr{color:var(--risk);font-size:12px;margin:8px 0 0}.prev{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:12px}
.dft{position:sticky;bottom:0;display:flex;gap:10px;justify-content:flex-end;margin:20px -20px -20px;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.ux,.cin input{border:1px solid var(--line);border-radius:12px;background:var(--surf);color:inherit;font:inherit;min-height:44px;padding:0 12px;text-align:right}.cin input{text-align:center}
.ux:focus,.cin input:focus{outline:0;border-color:var(--cop);box-shadow:0 0 0 3px var(--cop-s)}
.ln{flex-wrap:wrap}.rr{flex-wrap:wrap}
@media(max-width:380px){.rgi{grid-template-columns:minmax(0,1fr)}.dash{display:none}.dstat b{font-size:16px}}

.ndl textarea{display:block;width:100%;min-height:84px;border:1px solid var(--line);border-radius:12px;background:var(--surf);color:inherit;font:inherit;padding:10px 12px;resize:vertical;transition:border-color .15s,box-shadow .15s}
.ndl textarea:focus{outline:0;border-color:var(--cop);box-shadow:0 0 0 3px var(--cop-s)}
.ln{flex-wrap:nowrap}.ln>div:first-child{flex:1;min-width:0}.ln>div:last-child{flex:none}

@media(max-width:1180px){.xdd{display:none}}
</style>
<link rel="stylesheet" href="/forms.css">
</head>
<body>
<div class="app">
<div class="xhead"></div>
<nav class="xtabs" aria-label="Main">
<button data-v="stock" aria-current="page" title="Stock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l9-5 9 5v8l-9 5-9-5zM3 8l9 5 9-5M12 13v8"/></svg><span class="xtf">Stock</span><span class="xts">Stock</span></button>
<button data-v="usage" title="Usage reports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 9h6M9 13h6M9 17h3"/></svg><span class="xtf">Usage reports</span><span class="xts">Usage</span></button>
<button data-v="count" title="Daily count"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3 8-8M20 12v7H4V5h10"/></svg><span class="xtf">Daily count</span><span class="xts">Count</span></button>
<button data-v="requests" title="Requests"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13l2-8h12l2 8v6H4zM4 13h5l1 2h4l1-2h5"/></svg><span class="xtf">Requests</span><span class="xts">Requests</span></button>
</nav>
<main>
<div id="ntc"></div>
<section id="v-stock"><header><div><h1>Stock</h1><p class="sub" id="ssub"></p></div></header>
<div class="nd" id="sneed"></div>
<div class="acts" style="margin:0 0 14px"><button class="b" data-a="nitem">New item</button><button class="find" id="open" aria-label="Search"><span>Search stock, reports</span><kbd>Ctrl K</kbd></button></div>
<div class="seg" id="itabs" role="group" aria-label="Stock type"><button data-a="itab" data-k="ingredient" aria-pressed="true">Ingredients</button><button data-a="itab" data-k="packaging" aria-pressed="false">Packaging</button></div>
<div class="sg" id="sg"></div></section>
<section id="v-usage" hidden><header><div><h1>Usage reports</h1><p class="sub">Bakers report ranges. You confirm the exact amounts, and only then does stock drop.</p></div></header><div class="split"><div class="rl" id="ulist"></div><div class="card" id="udet"></div></div></section>
<section id="v-count" hidden><header><div><h1>Daily count</h1><p class="sub" id="csub"></p></div></header><div id="cbody" style="max-width:720px"></div></section>
<section id="v-requests" hidden><header><div><h1>Requests</h1><p class="sub">Alerts and requests for you, and the ones you sent.</p></div></header><div id="rq"></div></section>
</main></div>
<div class="pal" id="pal" role="dialog" aria-modal="true" aria-label="Search"><div><input id="q" placeholder="Search stock and usage reports" autocomplete="off"><ul id="res"></ul></div></div>
<div class="dr" id="dr" hidden><div class="dp" id="dp" role="dialog" aria-modal="true"></div></div>
<div class="rm" id="rm" hidden></div>
<script src="/cake.js"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=Cake.esc,toast=Cake.toast;
let IL=[],UIx=null,CD=null,view="stock",CH=null,it="ingredient",usel=null,udSig="",DI=null,cm=null,snd=true,ac,lastN=-1,RQ=null;
try{snd=localStorage.getItem("invSound")!=="off"}catch(e){}
const fmt=iso=>iso?new Date(iso).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"";
const r3=n=>Math.round(n*1e4)/1e4,mid=i=>r3((i.min+i.max)/2);
const IT=id=>IL.find(x=>x.ingredientId===id),guard=async(b,fn)=>{if(b&&b.disabled)return;if(b)b.disabled=true;try{return await fn()}finally{if(b&&b.isConnected)b.disabled=false}};
const reports=()=>UIx?[...UIx.pending,...UIx.recent]:[];
const sorted=L=>L.slice().sort((a,b)=>(a.daysLeft??1e9)-(b.daysLeft??1e9));

/* ---------- stock ---------- */
function sr(){const L=sorted(IL.filter(i=>i.kind===it)),n=IL.filter(i=>i.low).length,p=UIx?UIx.pending.length:0;
 $("#ssub").textContent=n+" item"+(n===1?" needs":"s need")+" attention · "+(CD&&CD.countedToday?"counted today at "+CD.countedToday:"not counted today");
 const cs=CD&&CD.session;
 $("#sneed").innerHTML=`<div class="card"><div class="row"><div><h2>Usage reports</h2><span class="mute">${p?p+" waiting for you":"All confirmed"}</span></div><button class="b ${p?"p":""}" data-a="goto" data-v="usage">Review</button></div></div><div class="card"><div class="row"><div><h2>Daily count</h2><span class="mute">${cs?"In progress":CD&&CD.countedToday?"Done at "+esc(CD.countedToday):"Not counted today"}</span></div><button class="b ${CD&&CD.countedToday&&!cs?"":"p"}" data-a="cstart">${cs?"Resume":"Start count"}</button></div></div>`;
 $$("#itabs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===it));
 $("#sg").innerHTML=L.map(i=>{const s=i.low?"low":"ok",pct=i.reorderLevel?Math.min(100,i.onHand/(i.reorderLevel*2)*100):100;return`<button class="rc ${i.low?"low":""}" data-a="item" data-id="${esc(i.ingredientId)}"><div class="row"><b>${esc(i.name)}</b><span class="tag ${i.low?"cop":""}">${i.low?"Low":"OK"}</span></div><div class="row"><span class="big">${esc(i.onHandText)}</span><span class="cdn ${i.low?"hot":""}">${esc(i.daysLeftLabel)}</span></div><div class="bar ${s}"><i style="width:${pct}%"></i><u></u></div><span class="mute">${i.reorderLevelText?"Reorder at "+esc(i.reorderLevelText):"No reorder level set"}</span><span class="mute">${i.pending?"Pending usage "+esc(i.pending.text)+" · ":""}${i.countedAt?"Counted "+esc(fmt(i.countedAt)):"Never counted"}</span></button>`}).join("")||'<p class="empty">Nothing here yet. Use New item to add one.</p>'}
const drw=h=>{$("#dp").innerHTML=h;$("#dr").hidden=false},xdr=()=>{$("#dr").hidden=true;DI=null};
function rrow(g,j,i){return`<div class="rgc" data-rg="${j}"><div style="display:grid;gap:8px"><input class="rgl2" value="${esc(g.label||"")}" maxlength="30" placeholder="Name, for example Small" aria-label="Amount name" style="width:100%;min-height:42px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit"><div style="display:flex;gap:8px;align-items:center"><div class="fld" style="flex:1"><input class="rga" type="number" inputmode="decimal" step="any" min="0" value="${g.min}" aria-label="From"><em>${i.unit}</em></div><span class="dash">–</span><div class="fld" style="flex:1"><input class="rgb" type="number" inputmode="decimal" step="any" min="0" value="${g.max}" aria-label="To"><em>${i.unit}</em></div><button class="b" data-a="rgdel" data-j="${j}" aria-label="Remove amount" style="min-height:42px;padding:0 12px">×</button></div></div></div>`}
const stat=i=>`<div><span>On hand</span><b>${esc(i.onHandText)}</b></div><div><span>Days left</span><b>${i.daysLeft===null?"—":Math.round(i.daysLeft*10)/10}</b></div><div><span>Status</span><b class="${i.low?"low":"ok"}">${i.low?"Low":"OK"}</b></div>`;
function ish(id){DI=id;const i=IT(id);if(!i)return;const U=i.unit,alt={kg:["kg","g"],l:["l","ml"],pcs:["pcs","dozen"]}[U];
 drw(`<div class="dh"><div><h2>${esc(i.name)}</h2><div class="mute">${i.kind==="ingredient"?"Ingredient":"Packaging"}${i.countedAt?" · counted "+esc(fmt(i.countedAt)):""}</div></div><button class="ib2" data-a="xd" aria-label="Close">×</button></div>
<div class="dstat">${stat(i)}</div>
<div class="dsec"><h3>Stock in and out</h3><p class="mute">Receive a delivery or write off waste. Counting is done in Daily count.</p><div class="fld"><input id="mq" type="number" inputmode="decimal" step="any" min="0" placeholder="Amount" aria-label="Amount"><select id="mu" aria-label="Unit" style="width:84px;flex:none;min-height:34px;margin:0 6px 0 0;border-radius:8px;border:1px solid var(--line);background-color:var(--paper);color:var(--ink);font:inherit">${alt.map(u=>`<option>${u}</option>`).join("")}</select></div><div class="fld" style="margin-top:8px"><input id="mn" maxlength="80" placeholder="Note (optional)" aria-label="Note"></div><div class="btns"><button class="b p" data-a="recv" data-id="${esc(id)}">Receive</button><button class="b" data-a="woff" data-id="${esc(id)}">Write off</button></div></div>
<div class="dsec"><h3>Reorder level</h3><p class="mute">You get an alert when stock reaches this level.</p><div class="fld"><input id="ro" type="number" inputmode="decimal" step="any" min="0" value="${i.reorderLevel??""}" aria-label="Reorder level in ${U}"><em>${U}</em></div></div>
${i.kind==="ingredient"?`<div class="dsec"><h3>Usage amounts</h3><p class="mute">The amounts the baker can tap when reporting usage, from smallest to largest.</p><div id="rglist">${i.ranges.map((g,j)=>rrow(g,j,i)).join("")}</div><div class="btns"><button class="b" data-a="rgadd">Add amount</button></div></div>`:""}
<div class="dft"><button class="b" data-a="xd">Cancel</button><button class="b p" data-a="isave" data-id="${esc(id)}">Save changes</button></div>`)}
function readRanges(){return $$("#rglist .rgc").map(r=>({label:r.querySelector(".rgl2").value.trim(),min:parseFloat(r.querySelector(".rga").value),max:parseFloat(r.querySelector(".rgb").value)}))}
function newItem(){const d=Cake.dialog(`<h2>New stock item</h2><label for="ni-n">Name</label><input id="ni-n" maxlength="60"><label>Type</label><div class="cx-g" id="ni-k"><button class="cx-b" aria-pressed="true" data-k="ingredient">Ingredient</button><button class="cx-b" aria-pressed="false" data-k="packaging">Packaging</button></div><label for="ni-u">Measured in</label><select id="ni-u"><option value="kg">Kilograms</option><option value="g">Grams</option><option value="l">Litres</option><option value="ml">Millilitres</option><option value="pcs">Pieces</option></select><label for="ni-s">Stock now (optional)</label><input id="ni-s" type="number" inputmode="decimal" step="any" min="0"><label for="ni-r">Reorder level (optional)</label><input id="ni-r" type="number" inputmode="decimal" step="any" min="0"><div class="cx-a" style="margin-top:14px;justify-content:flex-end"><button class="cx-b" id="ni-x">Cancel</button><button class="cx-b p" id="ni-go">Add item</button></div>`),q=s=>d.el.querySelector(s);let kind="ingredient";
 q("#ni-k").onclick=e=>{const b=e.target.closest("button");if(!b)return;kind=b.dataset.k;d.el.querySelectorAll("#ni-k button").forEach(x=>x.setAttribute("aria-pressed",x===b))};q("#ni-x").onclick=d.close;
 q("#ni-go").onclick=()=>{const name=q("#ni-n").value.trim();if(!name)return toast("Give the item a name.");const s=parseFloat(q("#ni-s").value),r=parseFloat(q("#ni-r").value);guard(q("#ni-go"),async()=>{const o=await Cake.send("inventory/create_ingredient",{name,unit:q("#ni-u").value,kind,...(s>=0&&{openingStock:s}),...(r>0&&{reorderLevel:r})},name+" added.");if(o.ok){it=kind;sr();d.close()}})};q("#ni-n").focus()}

/* ---------- usage reports ---------- */
function ur(){const L=reports();if(!usel||!L.some(r=>r.reportId===usel))usel=L[0]?L[0].reportId:null;
 $("#ulist").innerHTML=L.map(r=>`<button class="rc" data-id="${esc(r.reportId)}" aria-selected="${r.reportId===usel}"><div class="row"><b>${esc(r.orderNumber)} · ${esc(r.cake.flavor)} cake</b><span class="tag ${r.status==="confirmed"?"":r.status==="sent_back"?"risk":"cop"}">${esc(r.statusLabel)}</span></div><span class="mute">From ${esc(r.reportedByName)} · ${esc(fmt(r.reportedAt))} · ${r.items.length} ingredient${r.items.length===1?"":"s"}</span></button>`).join("")||'<p class="empty">No usage reports yet.</p>';
 const r=L.find(x=>x.reportId===usel),sig=r?r.reportId+r.status:"";if(sig===udSig&&sig)return;udSig=sig;ud(r)}
function ud(r){if(!r){$("#udet").classList.add("is-empty");$("#udet").innerHTML='<p class="empty">Select a report to confirm.</p>';return}$("#udet").classList.remove("is-empty");const open=r.status==="reported"&&UIx.can.confirm;
 $("#udet").innerHTML=`<div class="row"><h2>${esc(r.orderNumber)} · ${esc(r.cake.flavor)} cake</h2><span class="tag ${r.status==="confirmed"?"":r.status==="sent_back"?"risk":"cop"}">${esc(r.statusLabel)}</span></div><p class="mute" style="margin:2px 0 0">Reported by ${esc(r.reportedByName)} at ${esc(fmt(r.reportedAt))}.${open?" Stock only drops when you confirm.":""}</p>${r.note?`<p>${esc(r.note)}</p>`:""}${r.sentBackReason?`<div class="item risk" style="margin:8px 0"><small>Sent back: ${esc(r.sentBackReason)}</small></div>`:""}
 ${r.items.map(l=>`<div class="ln"><div><b>${esc(l.name)}</b>${l.extra?' <span class="tag">Extra</span>':""}<div class="mute">Baker's range ${esc(l.rangeText)}${l.suggestedText?" · expected "+esc(l.suggestedText):""} · on hand ${esc(l.onHandText)}</div></div>${open?`<div style="text-align:right"><input class="ux" data-i="${esc(l.ingredientId)}" type="number" step="any" min="0" placeholder="${mid(l)}" aria-label="Exact amount of ${esc(l.name)} in ${l.unit}"> <span class="mute">${l.unit}</span></div>`:`<b>${esc(l.confirmedText||"Not confirmed")}${l.confirmedText?" used":""}</b>`}</div>`).join("")}
 ${open?'<div class="btns"><button class="b p" data-a="uok" data-id="'+esc(r.reportId)+'">Confirm with my amounts</button><button class="b" data-a="uacc" data-id="'+esc(r.reportId)+'">Accept ranges as reported</button><button class="b r" data-a="usb" data-id="'+esc(r.reportId)+'">Send back</button></div><p class="mute">Leave a box empty to use the middle of the baker\'s range.</p>':""}`}
function confirmReport(r,typed,b){const xs=$$(".ux"),items=[];for(const l of r.items){const x=typed&&xs.find(y=>y.dataset.i===l.ingredientId),v=x&&x.value!==""?parseFloat(x.value):mid(l);if(!(v>=0))return toast("Check the amounts you typed.");items.push({ingredientId:l.ingredientId,qty:v})}
 guard(b,()=>Cake.send("usage/confirm",{reportId:r.reportId,items},"Confirmed. Stock updated."))}

/* ---------- daily count ---------- */
function cr(){const cs=CD&&CD.session;$("#csub").textContent=CD&&CD.countedToday?"Counted today at "+CD.countedToday:"Not counted today";if(!CD)return;
 const none=!cs&&!IL.length;$("#cbody").innerHTML=`<div class="card"><h2>${cs?"Count in progress":"Daily count"}</h2><p class="mute">${cs?cs.done+" of "+cs.total+" counted.":none?"There is nothing to count yet. Add ingredients or packaging in Stock first, then come back.":"Count every ingredient and packaging item, one at a time. You review the differences before anything is saved."}</p><div class="btns">${none?'<button class="b p" data-a="goto" data-v="stock">Go to Stock</button>':`<button class="b p" data-a="cstart">${cs?"Resume count":"Start daily count"}</button>`}${cs?'<button class="b r" data-a="cdisc">Throw this count away</button>':""}</div></div><div class="card" style="margin-top:12px"><h2>Past counts</h2>${CD.history.map(c=>`<div class="rr"><span>${esc(fmt(c.at))} · ${esc(c.byName)}</span><span class="mute">${c.items} items · ${c.differences} differences${c.big?" · "+c.big+" big":""}</span></div>`).join("")||'<p class="mute">No counts yet.</p>'}</div>`}
function cmh(){const s=CD&&CD.session;if(!s){$("#rm").hidden=true;cm=null;return}const L=s.items,N=L.length,i=L[cm.i];let h;
 if(cm.rev){h=`<div><div class="row"><div><span class="mute">Closing review</span><h1>Check the differences</h1></div><button class="b" data-a="xr">Exit</button></div><p class="mute">${s.differences} difference${s.differences===1?"":"s"} · ${s.big} big · ${s.skipped} not counted. Nothing is saved to stock until you submit.</p>${L.map((x,j)=>`<div class="rr"><span><b>${esc(x.name)}</b><br><small class="mute">Expected ${esc(x.expectedText)}</small></span><span style="text-align:right">${x.counted===null?'<span class="tag none">Not counted</span>':`<b>${esc(x.countedText)}</b> <span class="tag ${x.big?"risk":x.difference?"cop":""}">${x.difference?esc(x.differenceText):"Matches"}</span>`} <button class="b" data-a="cedit" data-i="${j}">Edit</button></span></div>`).join("")}<div class="rmf"><button class="b" data-a="cb">Back to counting</button><button class="b p" data-a="csub">Submit count</button></div></div>`}
 else h=`<div><div class="row"><div><span class="mute">Daily count · ${cm.i+1} of ${N}</span><h1>${esc(i.name)}</h1></div><button class="b" data-a="xr">Exit</button></div><div class="bar"><i style="width:${s.done/N*100}%"></i></div><p class="mute">${i.kind==="ingredient"?"Ingredient":"Packaging"} · system expects <b>${esc(i.expectedText)}</b>${i.lastCountedText?" · last counted "+esc(i.lastCountedText):""}</p><div class="cin"><button class="b" data-a="cm" aria-label="Less">−</button><input id="cv" type="number" inputmode="decimal" step="any" min="0" value="${i.counted??""}" placeholder="${r3(i.expected)}" aria-label="Counted amount in ${i.unit}"><button class="b" data-a="cp" aria-label="More">+</button></div><p class="mute" style="text-align:center">${i.unit} <button class="b" style="margin-left:8px" data-a="cx">Matches system</button></p><div class="rmf"><button class="b" data-a="cb" ${cm.i?"":"disabled"}>Back</button><span class="acts"><button class="b" data-a="csk">Skip</button><button class="b p" data-a="cn">${cm.i===N-1?"Review count":"Save and next"}</button></span></div></div>`;
 $("#rm").innerHTML=h;$("#rm").hidden=false;const c=$("#cv");if(c)c.focus()}
async function crec(counted){const s=CD.session,i=s.items[cm.i],o=await Cake.send("count/record",{sessionId:s.sessionId,ingredientId:i.ingredientId,counted});if(!o.ok)return false;const f=await Cake.read("count_session",{});if(f)CD=f;if(cm.ret||cm.i>=s.items.length-1){cm.rev=true;cm.ret=false}else cm.i++;cmh();return true}

/* ---------- search, sound, navigation ---------- */
const pal=$("#pal"),opn=()=>{pal.classList.add("on");$("#q").value="";show();$("#q").focus()};
function show(){const v=$("#q").value.toLowerCase(),a=IL.filter(i=>i.name.toLowerCase().includes(v)).map(i=>`<li><button data-k="i" data-id="${esc(i.ingredientId)}"><span>${esc(i.name)}</span><span class="mute">${esc(i.onHandText)} · ${esc(i.daysLeftLabel)}</span></button></li>`),b=reports().filter(r=>(r.orderNumber+r.reportedByName+r.cake.flavor).toLowerCase().includes(v)).map(r=>`<li><button data-k="u" data-id="${esc(r.reportId)}"><span>${esc(r.orderNumber)} ${esc(r.cake.flavor)} cake</span><span class="mute">Usage report</span></button></li>`);$("#res").innerHTML=[...a,...b].join("")||'<li class="empty" style="padding:12px">No match.</li>'}
function beep(){CH&&CH.ring();if(!snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();[0,.3].forEach(d=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+d);o.stop(ac.currentTime+d+.2)})}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function go(v){view=v;CH&&CH.setPage(v);$$("main>section").forEach(x=>x.hidden=x.id!=="v-"+v);$$("nav.xtabs button").forEach(x=>x.dataset.v===v?x.setAttribute("aria-current","page"):x.removeAttribute("aria-current"));if(v==="stock")sr();if(v==="usage")ur();if(v==="count")cr();if(v==="requests"&&RQ)RQ.shown();scrollTo(0,0)}
$$("nav.xtabs button").forEach(x=>x.onclick=()=>go(x.dataset.v));
const A={itab(d,b){it=b.dataset.k;sr()},item(d){ish(d.id)},goto(d){go(d.v)},xd(){xdr()},nitem(){newItem()},
 recv(d,b){const n=parseFloat($("#mq").value),note=$("#mn").value.trim();if(!(n>0))return toast("Enter the amount first.");guard(b,async()=>{const o=await Cake.send("inventory/receive",{ingredientId:d.id,qty:n,unit:$("#mu").value,...(note&&{note})},"Stock received.");if(o.ok){$("#mq").value="";$("#mn").value=""}})},
 woff(d,b){const n=parseFloat($("#mq").value),note=$("#mn").value.trim();if(!(n>0))return toast("Enter the amount first.");guard(b,async()=>{const o=await Cake.send("inventory/write_off",{ingredientId:d.id,qty:n,unit:$("#mu").value,...(note&&{note})},"Written off.");if(o.ok){$("#mq").value="";$("#mn").value=""}})},
 rgadd(){const i=IT(DI),last=readRanges().pop(),g={label:"",min:last&&last.max>=0?last.max:0,max:""};$("#rglist").insertAdjacentHTML("beforeend",rrow(g,$$("#rglist .rgc").length,i))},rgdel(d,b){b.closest(".rgc").remove()},
