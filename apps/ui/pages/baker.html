<link rel="stylesheet" href="/fonts.css">
<style>
:root{--bg:#FDFBF7;--paper:#F5F1E8;--surf:#fff;--line:#E6DECD;--ink:#1F1A13;--mute:#6B5E4F;--cop:#C47F3D;--cop-d:#9A5F2A;--cop-s:#C47F3D1f;--sage:#5E7247;--sage-s:#5E72471c;--risk:#B4452F;--risk-s:#B4452F18;--sh:0 1px 2px #1f1a1308,0 10px 28px -14px #1f1a1322;--ease:cubic-bezier(.32,.72,0,1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

@media(max-width:540px){.dp{width:100%}}

.ndl textarea{display:block;width:100%;min-height:84px;border:1px solid var(--line);border-radius:12px;background:var(--surf);color:inherit;font:inherit;padding:10px 12px;resize:vertical;transition:border-color .15s,box-shadow .15s}
.ndl textarea:focus{outline:0;border-color:var(--cop);box-shadow:0 0 0 3px var(--cop-s)}

@media(max-width:1180px){.xdd{display:none}}
</style>
<link rel="stylesheet" href="/forms.css">
</head>
<body>
<div class="app">
<div class="xhead"></div>
<nav class="xtabs" aria-label="Main">
<button data-v="queue" aria-current="page" title="Queue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16v-6H4zM6 14v-3h12v3M12 11V7"/></svg><span class="xtf">Queue</span><span class="xts">Queue</span></button>
<button data-v="tickets" title="Tickets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4z"/></svg><span class="xtf">Tickets</span><span class="xts">Tickets</span></button>
<button data-v="batches" title="Batches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9h18M5 9v10h14V9M8 9V5h8v4"/></svg><span class="xtf">Batches</span><span class="xts">Batches</span></button>
<button data-v="usage" title="Usage reports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 9h6M9 13h6M9 17h3"/></svg><span class="xtf">Usage reports</span><span class="xts">Usage</span></button>
<button data-v="requests" title="Requests"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13l2-8h12l2 8v6H4zM4 13h5l1 2h4l1-2h5"/></svg><span class="xtf">Requests</span><span class="xts">Requests</span></button>
</nav>
<main>
<div id="ntc"></div>
<section id="v-queue"><header><div><h1>Today's bakes</h1><p class="sub" id="qsub"></p></div><div class="acts"><button class="b p" data-a="use">Report usage</button><button class="b" data-a="log">Log batch</button><button class="find" id="open" aria-label="Search"><span>Search cakes, customers</span><kbd>Ctrl K</kbd></button></div></header>
<div class="split"><div class="rl" id="rl0"></div><div class="card" id="dt"></div></div></section>
<section id="v-tickets" hidden><header><div><h1>Tickets</h1><p class="sub" id="tsub"></p></div></header>
<div class="ztools"><div class="zrow"><div class="zsrch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="zq" type="search" placeholder="Search ticket, customer or cake" aria-label="Search tickets" autocomplete="off"></div><div class="zsel"><select id="zf" aria-label="Show tickets in"></select></div></div></div>
<div class="zboard" id="zboard"></div></section>
<section id="v-batches" hidden><header><div><h1>Batches</h1><p class="sub">Log ready-made items as they come out of the oven.</p></div></header><div class="grid"><section class="card stock" id="bf"></section><section class="card req"><h2>Logged today</h2><div id="bl"></div></section></div></section>
<section id="v-usage" hidden><header><div><h1>Usage reports</h1><p class="sub">Stock only drops once Inventory confirms the exact amounts.</p></div><button class="b p" data-a="use">Report usage</button></header><div class="grid"><section class="card act"><div id="ul"></div></section></div></section>
<section id="v-requests" hidden><header><div><h1>Requests</h1><p class="sub">Alerts and requests for you, and the ones you sent.</p></div></header><div id="rq"></div></section>
</main></div>
<div class="pal" id="pal" role="dialog" aria-modal="true" aria-label="Search"><div><input id="q" placeholder="Search cakes and customers" autocomplete="off"><ul id="res"></ul></div></div>
<div class="dr" id="dr" hidden><div class="dp" id="dp" role="dialog" aria-modal="true"></div></div>
<div class="rm" id="rm" hidden></div>
<script src="/cake.js"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=Cake.esc,toast=Cake.toast;
let Q=null,BL=null,UI=null,sel=null,form=null,stopForm=null,view="queue",CH=null,zf="all",snd=true,ac,lastN=-1,rmx=null,us=null,bq=12,RQ=null;
const SNDKEY="bakerSound";try{snd=localStorage.getItem(SNDKEY)!=="off"}catch(e){}
const TONE={neutral:"",attention:"cop",ready:"",done:"",muted:"",danger:"risk"};
const rows=()=>Q?Q.rows:[],find=id=>rows().find(r=>r.lineId===id);
const cakeName=r=>(r.cake.sizeNote?r.cake.sizeNote+" ":"")+"custom cake";
const dueAt=r=>r.deliveryDate?r.dueLabel:"No date set";
const isReady=r=>r.status==="ready"||r.status==="out_for_delivery",isHot=r=>!isReady(r)&&(r.urgency==="late"||r.urgency==="today"),isLate=r=>!isReady(r)&&r.urgency==="late";
const cl=r=>isLate(r)?"risk":isHot(r)?"hot":isReady(r)?"dn":"";
const tg=r=>`<span class="tag ${r.statusTone==="danger"?"risk":isReady(r)?"":r.status==="new"?"":"cop"}" style="${r.status==="new"?"background:var(--paper);color:var(--mute)":""}">${esc(r.statusLabel)}</span>`;
const csearch=r=>[r.orderNumber,r.customerName,r.cake.flavor,r.cake.filling,r.cake.inscription,r.cake.sizeNote].join(" ").toLowerCase();
const photoCache=new Map();
function fillPhotos(root){root.querySelectorAll("[data-ph]").forEach(async el=>{const id=el.dataset.ph;if(!photoCache.has(id))photoCache.set(id,Cake.photoUrl(id));const u=await photoCache.get(id);if(u&&el.isConnected)el.innerHTML=`<img src="${u}" alt="Reference photo" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">`})}

/* ---------- queue ---------- */
function qr(){if(!Q)return;const L=rows(),c=Q.counts;
 $("#qsub").textContent=(c.toStart+c.inProduction)+" to make"+(c.late?" · "+c.late+" overdue":"")+" · "+c.ready+" ready";
 const G=[["Overdue and due today",L.filter(r=>isHot(r)),1],["Soon",L.filter(r=>!isReady(r)&&!isHot(r)&&r.urgency==="soon"),0],["Upcoming",L.filter(r=>!isReady(r)&&!isHot(r)&&r.urgency!=="soon"),0],["Ready for handover",L.filter(isReady),0]].filter(g=>g[1].length);
 $("#rl0").innerHTML=G.map(([h,l,hot])=>`<div class="gl ${hot?"hot":""}">${h} · ${l.length}</div>`+l.map(r=>`<button class="rc ${cl(r)}" data-a="open" data-id="${esc(r.lineId)}" aria-selected="${r.lineId===sel}"><div class="row"><b>${esc(cakeName(r))} · ${esc(r.cake.flavor)}</b><span class="cdn">${isReady(r)?"Ready":esc(dueAt(r))}</span></div><span class="mute">${esc(r.orderNumber)} · ${esc(r.customerName)} · serves ${r.cake.servings}</span><span class="mute">${esc(r.cake.flavor)}${r.cake.filling?" · "+esc(r.cake.filling):""}</span><div class="row"><div style="flex:1"></div>${r.cake.allergyNotes?'<span class="tag risk">Allergy</span>':""}${tg(r)}${r.usage.state==="reported"||r.usage.state==="confirmed"?'<span class="tag">Usage reported</span>':""}</div></button>`).join("")).join("")||'<p class="empty">No custom cakes in the queue.</p>';
 if(!$("#v-tickets").hidden)tkr();}
function qd(){const r=find(sel);if(!r){$("#dt").innerHTML='<p class="empty">Pick a cake to see what to make.</p>';return}const k=r.cake;
 const sug=form&&form.lineId===r.lineId?form:null;
 $("#dt").innerHTML=`<button class="b bk" data-a="back">‹ Queue</button><div class="row"><h2>${esc(cakeName(r))}, ${esc(k.flavor)}</h2>${tg(r)}</div><p class="mute" style="margin:2px 0 0">Order ${esc(r.orderNumber)} · ${esc(r.customerName)} · ${esc(dueAt(r))}${r.fulfilment==="delivery"?" · delivery":""}</p>
 ${k.allergyNotes?`<div class="item risk" style="margin:12px 0"><div class="row"><b>Allergy notes</b><span class="tag risk">Check first</span></div><small>${esc(k.allergyNotes)}</small></div>`:""}
 <dl class="kv"><dt>Size</dt><dd>${esc(k.sizeNote||"Not given")}</dd><dt>Servings</dt><dd>${k.servings}</dd><dt>Flavor</dt><dd>${esc(k.flavor)}</dd><dt>Filling</dt><dd>${esc(k.filling||"None")}</dd><dt>Layers</dt><dd>${k.layers}</dd>${k.dietary.length?`<dt>Dietary</dt><dd>${esc(k.dietary.join(", "))}</dd>`:""}</dl>
 ${k.decorationNotes?`<p><span class="mute">Decoration</span><br>${esc(k.decorationNotes)}</p>`:""}
 ${k.inscription?`<div class="tkt"><div class="no">${esc(r.orderNumber)}</div><div class="in"><span class="mute">Write on the cake</span><b class="serif" style="font-size:18px">“${esc(k.inscription)}”</b></div></div>`:'<p class="mute">No text to write on this cake.</p>'}
 <h2 style="font-size:15px;margin-top:18px">Reference photos</h2><div class="ph">${k.photoIds.length?k.photoIds.map(p=>`<div data-ph="${esc(p)}"></div>`).join(""):'<span class="mute">None attached</span>'}</div>
 <h2 style="font-size:15px;margin-top:18px">Suggested recipe</h2>${sug?(sug.suggested.length?`<p class="mute" style="margin:2px 0 6px">System suggestion for ${k.servings} servings.</p>`+sug.suggested.map(i=>`<div class="rr"><span>${esc(i.name)}</span><b class="num">${esc(i.suggestedText||"")}</b></div>`).join(""):`<p class="mute">${esc(sug.blockedReason||"No suggestion yet. It appears when baking starts.")}</p>`):'<p class="mute">Loading…</p>'}
 <div class="btns">${r.actions.map((a,i)=>`<button class="b ${i?"":"p"}" data-a="adv" data-id="${esc(r.lineId)}" data-to="${esc(a.to)}">${esc(a.label)}</button>`).join("")}${(r.status==="in_production"||r.status==="decorating")?`<button class="b" data-a="recipe" data-id="${esc(r.lineId)}">Open recipe mode</button>`:""}${r.usage.canReport?`<button class="b" data-a="use" data-id="${esc(r.lineId)}">Report usage</button>`:""}${isReady(r)?'<span class="tag">Ready. Cashier hands it over</span>':""}</div>`;
 fillPhotos($("#dt"))}
function watchForm(){if(stopForm){stopForm();stopForm=null}form=null;const r=find(sel);if(!r){qd();return}stopForm=Cake.feed("usage_form",{orderId:r.orderId,lineId:r.lineId},d=>{form=d;qd();if(rmx&&rmx.id===d.lineId)rmh()})}

/* ---------- tickets ---------- */
const ZK=[["new","New",["new"],"Nothing waiting to be started"],["baking","Baking",["in_production","decorating"],"Nothing in the oven"],["ready","Ready",["ready","out_for_delivery"],"Nothing ready yet"]];
const ZI='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg>',ZA='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
function zbars(no){let h=7;for(const c of no)h=(h*31+c.charCodeAt(0))>>>0;let x=0,q="";for(let i=0;i<60;i++){h=(h*1664525+1013904223)>>>0;const w=1+(h>>>28)%3;if(i%2===0)q+=`<rect x="${x}" width="${w}" height="30"/>`;x+=w}return`<svg viewBox="0 0 ${x} 30" preserveAspectRatio="none" aria-hidden="true" fill="currentColor">${q}</svg>`}
function zt(r){const k=r.cake,late=isLate(r)?r.dueLabel:isHot(r)?"Due today":"",a=r.actions[0];
 return`<div class="ztw"><article class="ztt">${late?`<span class="zage">${esc(late)}</span>`:""}<div class="zth"><div><div class="zshop">${esc(r.customerName)}</div><div class="zcap">Kitchen ticket</div></div><button class="zplus" data-det="${esc(r.lineId)}" aria-label="Details for ${esc(r.orderNumber)}" title="Details">${ZI}</button></div>
<div class="ztm"><span class="zstc ${isReady(r)?"ok":isLate(r)?"risk":""}">${esc(r.statusLabel)}</span><span class="zcap">${esc(k.sizeNote||"Custom")} · serves ${k.servings}</span></div><div class="zperf"></div>
<div class="ztnum"><div class="zcap">Ticket number</div><div class="znum">${esc(r.orderNumber)}</div></div>
<dl><div class="zrw"><span>Flavor</span><b class="zell">${esc(k.flavor)}${k.filling?" · "+esc(k.filling):""}</b></div><div class="zrw"><span>Due</span><b class="zell">${esc(dueAt(r))}</b></div><div class="zrw"><span>Allergy</span><b class="zell ${k.allergyNotes?"risk":""}">${k.allergyNotes?"See notes":"None noted"}</b></div><div class="zrw tot"><span>Write</span><b class="zell">${k.inscription?"“"+esc(k.inscription)+"”":"Nothing"}</b></div></dl>
<div class="zperf"></div><div class="zbc">${zbars(r.orderNumber)}</div></article>${a?`<button class="zgo" data-a="adv" data-id="${esc(r.lineId)}" data-to="${esc(a.to)}">${esc(a.label)} ${ZA}</button>`:""}</div>`}
function tkr(){if(!Q)return;const v=($("#zq").value||"").toLowerCase().replace(/\s/g,""),V=rows().filter(r=>!v||csearch(r).replace(/\s/g,"").includes(v)),inK=z=>V.filter(r=>z[2].includes(r.status)),cols=ZK.filter(z=>zf==="all"||zf===z[0]);
 $("#tsub").textContent=(Q.counts.toStart+Q.counts.inProduction)+" open · "+Q.counts.late+" overdue · "+Q.counts.ready+" ready. Open a ticket to see its recipe.";
 $("#zf").innerHTML=`<option value="all">All tickets (${V.length})</option>`+ZK.map(z=>`<option value="${z[0]}">${z[1]} (${inK(z).length})</option>`).join("");$("#zf").value=zf;
 $("#zboard").className="zboard"+(zf==="all"?"":" one");
 $("#zboard").innerHTML=cols.map(z=>{const L=inK(z);return`<section class="zcol" aria-label="${z[1]}"><h2 class="zch">${z[1]}<span class="zcn">${L.length}</span></h2><div class="zcl">${L.map(zt).join("")||`<p class="zem">${$("#zq").value?"No tickets match your search":z[3]}</p>`}</div></section>`}).join("")}
$("#zq").oninput=tkr;$("#zf").onchange=e=>{zf=e.target.value;tkr();scrollTo(0,0)};
$("#zboard").onclick=e=>{const d=e.target.closest("[data-det]");if(d){go("queue");A.open({id:d.dataset.det})}};

/* ---------- batches ---------- */
let bformFor="";
function br(){if(!BL)return;const sig=BL.options.map(o=>o.combinationId).join();
 if(sig!==bformFor&&BL.can.log){bformFor=sig;$("#bf").innerHTML=`<h2>Log a finished batch</h2><label class="fl"><span>Product</span><select id="bp">${BL.options.map(o=>`<option value="${esc(o.combinationId)}">${esc(o.label)}</option>`).join("")}</select></label><div class="fl"><span>Quantity</span><div class="qt"><button class="b" data-a="bm" aria-label="Fewer">−</button><b class="num" id="bqn">${bq}</b><button class="b" data-a="bpl" aria-label="More">+</button></div></div><label class="fl"><span>Note (optional)</span><input id="bnt" maxlength="80" placeholder="For example, one tray slightly dark"></label><div class="btns"><button class="b p" data-a="blog">Log batch</button></div>`}
 else if(!BL.can.log)$("#bf").innerHTML='<h2>Log a finished batch</h2><p class="mute">Only the baker and the owner log batches.</p>';
 $("#bl").innerHTML=(BL.rows.length?`<p class="mute sm" style="margin:0 0 8px">${BL.today.batches} batch${BL.today.batches===1?"":"es"} today · ${BL.today.items} items</p>`:"")+BL.rows.map(b=>`<div class="rr"><span><b>${esc(b.label)}</b> × ${b.qty}${b.note?`<br><small class="mute">${esc(b.note)}</small>`:""}<br><small class="mute">${esc(b.byName)}</small></span><span class="mute">${esc(b.timeText)}${b.canUndo?` <button class="b" style="min-height:32px;padding:0 10px" data-a="bundo" data-id="${esc(b.batchId)}">Take back</button>`:""}</span></div>`).join("")||'<p class="empty">Nothing logged yet.</p>'}

/* ---------- usage reports ---------- */
function ul(){if(!UI)return;const L=[...UI.pending,...UI.recent];
 $("#ul").innerHTML=L.length?L.map(u=>{const again=rows().find(r=>r.lineId===u.lineId&&r.usage.canReport);return`<div class="rq" style="max-height:none"><div class="row"><b>${esc(u.orderNumber)} · ${esc(u.cake.flavor)} cake</b><span class="tag ${u.status==="confirmed"?"":u.status==="sent_back"?"risk":"cop"}">${esc(u.statusLabel)}</span></div><div class="mute">Sent ${new Date(u.reportedAt).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})} by ${esc(u.reportedByName)}</div>${u.sentBackReason?`<div class="item risk" style="margin:6px 0"><small>Sent back: ${esc(u.sentBackReason)}</small></div>`:""}${u.items.map(l=>`<div class="rr"><span>${esc(l.name)}${l.extra?' <span class="tag">Extra</span>':""}</span><span class="mute">${esc(l.confirmedText||l.rangeText)}</span></div>`).join("")}${again?`<div class="btns"><button class="b" data-a="use" data-id="${esc(u.lineId)}">Report again</button></div>`:""}</div>`}).join(""):'<p class="empty">No reports yet. Use Report usage after a bake.</p>'}
const drw=h=>{$("#dp").innerHTML=h;$("#dr").hidden=false},xdr=()=>{$("#dr").hidden=true;us=null};
async function ush(){const cand=rows().filter(r=>r.usage.canReport);
 if(!us.f&&us.id){const r=find(us.id);if(r){us.f=await Cake.read("usage_form",{orderId:r.orderId,lineId:r.lineId});if(us.f){us.p={};us.f.suggested.forEach(i=>us.p[i.ingredientId]=i.suggestedRangeId);us.ex=[]}}}
 const f=us.f,all=f?[...f.suggested,...f.extras.filter(x=>us.ex.includes(x.ingredientId))]:[];
 drw(`<div class="row"><h2>Report usage</h2><button class="b" data-a="xd">Close</button></div><p class="mute">Pick the cake, then tap the amount that matches what you used. Tap it again if you did not use it.</p><div class="ucv">${cand.map(r=>`<button aria-pressed="${r.lineId===us.id}" data-a="uc" data-id="${esc(r.lineId)}">${esc(r.orderNumber)} ${esc(r.cake.flavor)}</button>`).join("")||'<span class="mute">No cake is ready for a report. Start baking first.</span>'}</div>
 ${all.map(i=>`<div class="ur"><div class="row"><b>${esc(i.name)}</b><span class="mute">${i.suggestedText?"Suggested "+esc(i.suggestedText):"Not on the suggestion"}</span></div><div class="pre">${i.ranges.map(g=>`<button aria-pressed="${us.p[i.ingredientId]===g.rangeId}" data-a="up" data-n="${esc(i.ingredientId)}" data-r="${esc(g.rangeId)}">${esc(g.text)}</button>`).join("")}</div></div>`).join("")}
 ${f&&f.extras.length?`<label class="fl"><span>Extra ingredient not on the suggestion</span><select id="xs">${f.extras.filter(x=>!us.ex.includes(x.ingredientId)).map(x=>`<option value="${esc(x.ingredientId)}">${esc(x.name)}</option>`).join("")}</select></label><div class="btns"><button class="b" data-a="ux">Add ingredient</button>`:'<div class="btns">'}<button class="b p" id="usb" data-a="usend" ${f&&f.canReport?"":"disabled"}>Send to Inventory</button></div>${f&&!f.canReport&&f.blockedReason?`<p class="mute sm">${esc(f.blockedReason)}</p>`:""}`)}

/* ---------- recipe mode ---------- */
function rmh(){const r=find(rmx.id);if(!r){$("#rm").hidden=true;rmx=null;return}const k=r.cake,f=form&&form.lineId===r.lineId?form:null,L=f?f.suggested:[];
 $("#rm").innerHTML=`<div><div class="row"><div><span class="mute">Recipe mode · ${esc(r.orderNumber)}</span><h1>${esc(cakeName(r))}, ${esc(k.flavor)}</h1></div><button class="b" data-a="xr">Exit</button></div>${k.allergyNotes?`<div class="item risk" style="margin-top:14px"><div class="row"><b>Allergy notes</b><span class="tag risk">Check first</span></div><small>${esc(k.allergyNotes)}</small></div>`:""}${k.inscription?`<div class="tkt"><div class="no">${esc(r.orderNumber)}</div><div class="in"><span class="mute">Write on the cake</span><b class="serif" style="font-size:18px">“${esc(k.inscription)}”</b></div></div>`:""}<p class="mute">System suggestion for ${k.servings} servings. Tick as you go.</p>${L.map((i,n)=>`<button class="ri" aria-pressed="${rmx.t.has(i.ingredientId)}" data-a="tk" data-i="${esc(i.ingredientId)}"><span class="sw"><i></i></span><span class="nm">${esc(i.name)}</span><b class="num">${esc(i.suggestedText||"")}</b></button>`).join("")||'<p class="mute">No suggestion for this cake.</p>'}<div class="rmf"><span class="mute" id="rmc">${rmx.t.size} of ${L.length} ticked</span><span class="acts">${r.usage.canReport?`<button class="b" data-a="use" data-id="${esc(r.lineId)}">Report usage</button>`:""}${r.actions.map((a,i)=>`<button class="b ${i?"":"p"}" data-a="adv" data-id="${esc(r.lineId)}" data-to="${esc(a.to)}">${esc(a.label)}</button>`).join("")}</span></div></div>`;$("#rm").hidden=false}

/* ---------- search ---------- */
const pal=$("#pal"),opn=()=>{pal.classList.add("on");$("#q").value="";show();$("#q").focus()};
function show(){const v=$("#q").value.toLowerCase();$("#res").innerHTML=rows().filter(r=>csearch(r).includes(v)).map(r=>`<li><button data-id="${esc(r.lineId)}"><span>${esc(cakeName(r))} · ${esc(r.cake.flavor)}</span><span class="mute">${esc(r.orderNumber)} · ${esc(r.customerName)} · ${esc(dueAt(r))}</span></button></li>`).join("")||'<li class="empty" style="padding:12px">No match.</li>'}

/* ---------- sound ---------- */
function beep(){CH&&CH.ring();if(!snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();[0,.3].forEach(d=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+d);o.stop(ac.currentTime+d+.2)})}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}

/* ---------- navigation and actions ---------- */
function go(v){view=v;CH&&CH.setPage(v);$$("main>section").forEach(x=>x.hidden=x.id!=="v-"+v);$$("nav.xtabs button").forEach(x=>x.dataset.v===v?x.setAttribute("aria-current","page"):x.removeAttribute("aria-current"));if(v==="queue"){qr();qd()}if(v==="tickets")tkr();if(v==="batches")br();if(v==="usage")ul();if(v==="requests"&&RQ)RQ.shown();scrollTo(0,0)}
$$("nav.xtabs button").forEach(x=>x.onclick=()=>go(x.dataset.v));
const guard=async(b,fn)=>{if(b&&b.disabled)return;if(b)b.disabled=true;try{return await fn()}finally{if(b&&b.isConnected)b.disabled=false}};
const A={open(d){sel=d.id;$("#v-queue .split").classList.add("det");watchForm();qr();scrollTo(0,0)},back(){$("#v-queue .split").classList.remove("det")},
 adv(d,b){const r=find(d.id);guard(b,async()=>{const o=await Cake.send("orders/advance_line",{orderId:r.orderId,lineId:r.lineId,to:d.to});if(o.ok&&d.to==="in_production"){rmx={id:r.lineId,t:new Set()};rmh()}else if(o.ok&&rmx&&d.to!=="in_production"){$("#rm").hidden=true;rmx=null}})},
 recipe(d){rmx={id:d.id,t:new Set()};rmh()},
 tk(d,b){rmx.t.has(d.i)?rmx.t.delete(d.i):rmx.t.add(d.i);b.setAttribute("aria-pressed",rmx.t.has(d.i));const n=form?form.suggested.length:0;$("#rmc").textContent=rmx.t.size+" of "+n+" ticked"},
 xr(){$("#rm").hidden=true;rmx=null},
 use(d){us={id:d.id||null,f:null,p:{},ex:[]};ush()},uc(d){us.id=d.id;us.f=null;ush()},up(d){us.p[d.n]=us.p[d.n]===d.r?null:d.r;ush()},ux(){const v=$("#xs")&&$("#xs").value;if(v){us.ex.push(v);us.p[v]=us.f.extras.find(x=>x.ingredientId===v).suggestedRangeId||us.f.extras.find(x=>x.ingredientId===v).ranges[0]?.rangeId||null}ush()},xd(){xdr()},
 usend(d,b){const r=find(us.id);if(!r)return toast("Pick a cake first.");const items=Object.entries(us.p).filter(([,g])=>g).map(([ingredientId,rangeId])=>({ingredientId,rangeId}));if(!items.length)return toast("Pick an amount for at least one ingredient.");
  guard(b,async()=>{const o=await Cake.send("usage/report",{orderId:r.orderId,lineId:r.lineId,items},"Sent to Inventory. Stock moves when they confirm.");if(o.ok){xdr();$("#rm").hidden=true;rmx=null;go("usage")}})},
 log(){go("batches");setTimeout(()=>$("#bp")&&$("#bp").focus(),0)},bm(){bq=Math.max(1,bq-1);$("#bqn").textContent=bq},bpl(){bq++;$("#bqn").textContent=bq},
 blog(d,b){guard(b,async()=>{const note=$("#bnt").value.trim(),o=await Cake.send("batches/log",{combinationId:$("#bp").value,qty:bq,...(note&&{note})},"Batch logged.");if(o.ok)$("#bnt").value=""})},
 bundo(d,b){guard(b,()=>Cake.send("batches/undo",{batchId:d.id},"Batch taken back."))}};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset,b)});
$("#dr").onclick=e=>{if(e.target.id==="dr")xdr()};
$("#open").onclick=opn;$("#q").oninput=show;pal.onclick=e=>{const b=e.target.closest("li button");if(b){go("queue");A.open({id:b.dataset.id})}if(e.target===pal||b)pal.classList.remove("on")};
addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();opn()}if(e.key==="Escape"){pal.classList.remove("on");xdr();if(!$("#rm").hidden)A.xr()}});
/* shared header */
const xroot=document.documentElement,xhd=$(".xhead");try{const t=localStorage.getItem("theme");if(t)xroot.dataset.theme=t}catch(e){}
const xtb=$("nav.xtabs"),xh=()=>{const t=xhd.offsetHeight;xroot.style.setProperty("--ht",t+"px");xroot.style.setProperty("--hh",(t+(getComputedStyle(xtb).position==="sticky"?xtb.offsetHeight:0))+"px")};xh();new ResizeObserver(xh).observe(xhd);new ResizeObserver(xh).observe(xtb);
(async()=>{const me=await Cake.boot(["baker","owner"]);
 CH=Cake.mountChrome({groups:[{title:"Today",items:[{id:"queue",label:"Queue"},{id:"tickets",label:"Tickets"},{id:"requests",label:"Requests"}]},{title:"Kitchen",items:[{id:"batches",label:"Batches"},{id:"usage",label:"Usage reports"}]}],go,search:opn,bell:"requests",sound:{get:()=>snd,set:on=>{snd=on;try{localStorage.setItem(SNDKEY,on?"on":"off")}catch(e){}toast(on?"Sound and vibration on":"Sound and vibration off")}}});CH.setPage(view);
 Cake.mountNotice($("#ntc"));
 Cake.feed("bake_queue",{},d=>{Q=d;qr();if(view==="queue"){if(sel&&!find(sel)&&!stopForm){}qd()}if(rmx)rmh()});
 Cake.feed("batch_log",{},d=>{BL=d;br()});
 Cake.feed("usage_inbox",{},d=>{UI=d;ul()});
 RQ=Cake.mountRequests($("#rq"),{visible:()=>view==="requests",onCounts:c=>{const n=c.unseen+c.needsYou;CH&&CH.setBadge(n);if(lastN>=0&&n>lastN)beep();lastN=n}});
 go("queue")})();
